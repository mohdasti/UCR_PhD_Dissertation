project:
  type: book

book:
  title: "Effects of Concurrent Task Difficulty and Physical Effort on Cognitive Performance"
  output-file: "UCR_PhD_Dissertation"
  author: "Mohammad Dastgheib"
  date: "12/01/2026"
  chapters:
    - index.qmd
    - General_Introduction.qmd
    - Chapter_1.qmd
    - Chapter_2.qmd
    - Chapter_3.qmd
    - General_Conclusion.qmd
    - references.qmd
  appendices:
    - Appendix_A.qmd

bibliography: references.bib

# APA 7th edition (citation-style-language/styles, apa.csl)
csl: apa.csl

format:
  html:
    theme:
      - cosmo
      - brand

  pdf:
    documentclass: ucr
    pdf-engine: xelatex
    keep-tex: true
    colorlinks: true
    linkcolor: black
    urlcolor: black
    citecolor: black

    # We do these manually in index.qmd
    toc: false
    lof: false
    lot: false

    template-partials:
      - title.tex

    include-in-header:
      - ucr-preamble.tex

editor: visual
