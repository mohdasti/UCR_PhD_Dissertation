project:
  type: book

book:
  title: "Effects of Concurrent Task Difficulty and Physical Effort on Cognitive Performance"
  output-file: "UCR_PhD_Dissertation"
  author: "Mohammad Dastgheib"
  date: "12/01/2026"
  chapters:
    - index.qmd
    - Chapter_1_General_Introduction.qmd
    - Chapter_2_Concurrent_Effort_Younger_Adults.qmd
    - Chapter_3_Psychometric_Pupillometry.qmd
    - Chapter_4_DDM_Older_Adults.qmd
    - Chapter_5_General_Conclusion.qmd
    - references.qmd
  appendices:
    - Appendix_A_Chapter_2_Supplement.qmd
    - Appendix_B_Chapter_3_Supplement.qmd
    - Appendix_C_Chapter_4_Supplement.qmd

bibliography: references.bib
nocite: |
  @Sadi1900-gulistan

# APA 7th edition (citation-style-language/styles, apa.csl)
csl: apa.csl

format:
  html:
    theme:
      - cosmo
      - brand

  pdf:
    documentclass: ucr
    pdf-engine: xelatex
    keep-tex: true
    colorlinks: true
    linkcolor: black
    urlcolor: black
    citecolor: black

    # We do these manually in index.qmd
    toc: false
    lof: false
    lot: false

    template-partials:
      - title.tex

    include-in-header:
      - ucr-preamble.tex

editor: visual
